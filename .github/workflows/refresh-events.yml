name: Refresh RA events

on:
  schedule:
    - cron: '0 7 * * 1'   # weekly on Monday at 07:00 UTC (09:00 Copenhagen time)
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch events from RA
        run: python3 fetch-ra-events.py

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ra-events.json
          git diff --staged --quiet || git commit -m "chore: refresh RA events"
          git push
